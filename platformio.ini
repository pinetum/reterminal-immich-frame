; =============================================================================
;  reTerminal E1004 -- Immich ePaper photo frame
;
;  Hardware: Seeed Studio reTerminal E1004
;            ESP32-S3 (dual LX7 @240MHz) + 8MB OPI PSRAM + 32MB flash
;            13.3" E Ink Spectra 6, 1200x1600, 6 colours, packed 4bpp
;            5000mAh battery, microSD (FAT32), 3 front keys, buzzer, LED
;
;  Logs go out on UART1 (GPIO43 TX / GPIO44 RX) at 115200 -- that is where the
;  carrier board's USB-UART bridge is wired. The default Arduino `Serial`
;  (USB CDC) is unreliable on this board, so everything uses Serial1.
;
;  The 6-colour ditherer lives in src/e6_dither.* rather than lib/: it is our own
;  code, and keeping it in src keeps the include path unambiguous.
;
;  Two environments:
;    reterminal_e1004  the firmware (default)
;    gpio_probe        a standalone hardware probe, see the bottom of this file
; =============================================================================
[platformio]
default_envs = reterminal_e1004

; -----------------------------------------------------------------------------
; Settings shared by the firmware and the hardware probe.
; -----------------------------------------------------------------------------
[env]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; OPI PSRAM is MANDATORY. The EPaper class allocates a 960 kB framebuffer and the
; render pipeline needs several more MB. Without this the sprite alloc fails and
; every draw call writes through a null pointer.
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D BOARD_HAS_PSRAM
    ; Selects User_Setups/Setup523_Seeed_reTerminal_E1004.h inside Seeed_GFX,
    ; which defines T133A01_DRIVER + EPD_WIDTH 1200 / EPD_HEIGHT 1600 and all
    ; the SPI pins. Do not change this value.
    -D BOARD_SCREEN_COMBO=523
    -Wno-unused-variable
    -Wno-unused-but-set-variable

[env:reterminal_e1004]
; The probe lives in src/tools/, so keep it out of the firmware build.
build_src_filter = +<*> -<tools/>

lib_deps =
    ; TFT_eSPI fork with the EPaper class and the reTerminal panel drivers.
    https://github.com/Seeed-Studio/Seeed_GFX.git
    ; JPEGDEC is NOT listed here: a patched v1.8.4 is vendored in lib/JPEGDEC so
    ; that Immich's mozjpeg-encoded previews (SOF1, three AC Huffman tables)
    ; decode at all. See lib/JPEGDEC/PATCHES.md before bumping it.
    ; It gives us 1/2, 1/4 and 1/8 decode-time downscale, which is what keeps a
    ; 48MP original from blowing up PSRAM.
    ; Streaming PNG decoder (line callbacks), same author/API style as JPEGDEC.
    bitbank2/PNGdec@^1.1.0
    bblanchon/ArduinoJson@^7.4.2
    ; Maintained async webserver fork. Async matters here: a web-triggered panel
    ; refresh blocks for ~40 s and a synchronous server would drop the browser.
    esp32async/AsyncTCP@^3.4.0
    esp32async/ESPAsyncWebServer@^3.7.0
    ; Tiny QR encoder -- the config screen shows the admin URL as a QR code.
    ricmoo/QRCode@^0.0.1

; -----------------------------------------------------------------------------
; Hardware probe. Watches GPIO0-21 and reports every edge, plus LED, buzzer,
; battery and SD-detect checks. Use it on a fresh board, and to settle which
; GPIOs the BACK page-turn buttons are wired to -- Seeed's documentation only
; covers the three front keys.
;
;   pio run -e gpio_probe -t upload && pio device monitor -b 115200
;
; No libraries at all, so it builds in seconds.
; -----------------------------------------------------------------------------
[env:gpio_probe]
build_src_filter = -<*> +<tools/gpio_probe.cpp>
build_flags = -D BOARD_HAS_PSRAM
lib_deps =
